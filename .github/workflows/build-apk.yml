name: Build AETHER Android APK (Rust JNI + Kotlin)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Run Rust RFC-0001 & RFC-0002 Compliance Tests
        run: cargo test --release --test rfc_compliance -- --nocapture

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27
        run: sdkmanager "ndk;27.2.12479018"

      - name: Compile Rust aether-ffi (.so for ARM64 & ARMv7)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.2.12479018
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ./android/app/src/main/jniLibs build --release -p aether-ffi

      - name: Build Android Debug APK (Gradle 8.10)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Assemble AETHER APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload AETHER-v0.4.0-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-Messenger-v0.4.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
