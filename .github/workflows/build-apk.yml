name: Build AETHER Android APK (Rust JNI + Kotlin)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Run Rust RFC-0001 & RFC-0002 Compliance Tests
        run: cargo test --release --test rfc_compliance -- --nocapture

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Detect preinstalled Android SDK & NDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          NDK_DIR="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            NDK_DIR=$(ls -d "$SDK_DIR/ndk/"* 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          echo "Using SDK: $SDK_DIR"
          echo "Using NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

          SDKMGR="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            set +o pipefail
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            set -o pipefail
          fi

      - name: Compile Rust aether-ffi (.so for ARM64 & ARMv7)
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ./android/app/src/main/jniLibs build --release -p aether-ffi

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Assemble AETHER Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload AETHER-v0.4.0-debug.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AETHER-Messenger-v0.4.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
